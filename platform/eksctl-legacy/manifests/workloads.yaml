# APIs that were removed: each must move before the cluster can go past the version noted.
---
# Removed in 1.25 (PodSecurityPolicy has no replacement API: use Pod Security Admission labels).
# The former PodSecurityPolicy "reporting-restricted" (privileged: false, runAsUser MustRunAsNonRoot,
# volumes configMap/secret/emptyDir) is replaced by Pod Security Admission on the namespace:
# "baseline" is enforced (blocks privileged pods); "restricted" (also requires runAsNonRoot and
# limits volume types) is audited and warned first. Switch enforce to "restricted" once workloads comply.
apiVersion: v1
kind: Namespace
metadata:
  name: reporting
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.31
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.31
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.31
---
# batch/v1beta1 CronJob removed in 1.25: use batch/v1.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: reporting
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: public.ecr.aws/docker/library/python:3.8-slim
              command: ["python", "-m", "report"]
---
# policy/v1beta1 PodDisruptionBudget removed in 1.25: use policy/v1.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: report-api
  namespace: reporting
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: report-api }
---
# autoscaling/v2beta2 removed in 1.26: use autoscaling/v2.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: report-api
  namespace: reporting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: report-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
