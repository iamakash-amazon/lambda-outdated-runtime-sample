# EKS case L: legacy cluster defined with eksctl (code only, not deployed).
#
# Upgrade traps (what moving 1.24 to a supported version must change):
#  - 1.24 is past end of extended support; Amazon EKS auto-upgraded the live cluster. Set this file to the live
#    version first, then go one minor version at a time.
#  - amiFamily AmazonLinux2 has no AMIs for 1.33 and later: move to AmazonLinux2023 (overrideBootstrapCommand
#    and preBootstrapCommands are AL2-only).
#  - addon versions are pinned for 1.24.
#  - manifests/ use APIs removed in 1.25 and 1.26 (PodSecurityPolicy, batch/v1beta1, policy/v1beta1,
#    autoscaling/v2beta2).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: legacy-reporting
  region: us-east-1
  version: "1.24"
  tags:
    purpose: aws-health-e2e
    case: L

iam:
  withOIDC: true

vpc:
  subnets:
    private:
      us-east-1a: { id: subnet-02381f24a432d3dbf }
      us-east-1b: { id: subnet-088d2e13906443002 }

addons:
  - name: vpc-cni
    version: v1.11.4-eksbuild.1
  - name: coredns
    version: v1.8.7-eksbuild.3
  - name: kube-proxy
    version: v1.24.7-eksbuild.2

managedNodeGroups:
  - name: reporting
    amiFamily: AmazonLinux2
    instanceType: m5.large
    desiredCapacity: 2
    privateNetworking: true
    preBootstrapCommands:
      - "echo 'vm.max_map_count=262144' >> /etc/sysctl.conf && sysctl -p"
    overrideBootstrapCommand: |
      #!/bin/bash
      /etc/eks/bootstrap.sh legacy-reporting --kubelet-extra-args '--node-labels=pool=reporting'
