# flowcontrol.apiserver.k8s.io/v1beta3 was removed in Kubernetes 1.32: move to flowcontrol.apiserver.k8s.io/v1.
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: payments-batch
spec:
  priorityLevelConfiguration:
    name: workload-low
  matchingPrecedence: 1000
  distinguisherMethod:
    type: ByUser
  rules:
    - subjects:
        - kind: ServiceAccount
          serviceAccount:
            name: batch-runner
            namespace: payments
      resourceRules:
        - verbs: ["*"]
          apiGroups: ["*"]
          resources: ["*"]
          namespaces: ["payments"]
